[dependencies.bevy_picking]
path = "../../crates/bevy_picking"
version = "0.20.0-dev"
features = ["mesh_picking"]
optional = true

[dependencies.bevy_platform]
path = "../../crates/bevy_platform"
version = "0.20.0-dev"

[dependencies.bevy_reflect]
path = "../../crates/bevy_reflect"
version = "0.20.0-dev"

[dependencies.bevy_render]
path = "../../crates/bevy_render"
