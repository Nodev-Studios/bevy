# Vendored from bevy_egui 0.43.1 (crates.io, MIT), whose Bevy dependencies (^0.20.0) cannot resolve to this
# workspace's 0.20.0-dev crates. Path dependencies on this workspace; examples, tests and dev-dependencies left out.
# Only the gfx_viewer example uses it. Replace with the crates.io release once one targets this Bevy.
[package]
edition = "2024"
rust-version = "1.95.0"
name = "bevy_egui"
version = "0.43.1+bevy-main"
authors = ["vladbat00 <vladyslav.batyrenko@gmail.com>"]
build = false
exclude = [
    "assets/**/*",
    ".github/**/*",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A plugin for Egui integration into Bevy"
readme = "README.md"
license = "MIT"
repository = "https://github.com/vladbat00/bevy_egui"

[package.metadata.docs.rs]
features = [
    "bevy_winit/x11",
    "immutable_ctx",
]

[features]
accesskit = ["bevy_a11y"]
bevy_ui = [
    "bevy_ui_render",
    "render",
]
default = [
    "manage_clipboard",
    "open_url",
    "default_fonts",
    "render",
    "bevy_ui",
    "picking",
]
default_fonts = ["egui/default_fonts"]
immutable_ctx = []
log_file_dnd_messages = []
log_input_messages = []
manage_clipboard = [
    "arboard",
    "thread_local",
    "bytemuck",
    "egui/bytemuck",
    "smithay-clipboard",
]
open_url = ["webbrowser"]
picking = [
    "render",
    "bevy_picking",
]
render = [
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_extract",
    "bevy_image",
    "bevy_mesh",
    "bevy_render",
    "bevy_color",
    "bevy_shader",
    "bevy_transform",
    "encase",
    "bytemuck",
    "egui/bytemuck",
    "wgpu-types",
    "itertools",
]
serde = ["egui/serde"]

[lib]
name = "bevy_egui"
path = "src/lib.rs"














[dependencies.bevy_a11y]
path = "../../crates/bevy_a11y"
version = "0.20.0-dev"
optional = true

[dependencies.bevy_app]
path = "../../crates/bevy_app"
version = "0.20.0-dev"

[dependencies.bevy_asset]
path = "../../crates/bevy_asset"
version = "0.20.0-dev"
optional = true

[dependencies.bevy_camera]
path = "../../crates/bevy_camera"
version = "0.20.0-dev"

[dependencies.bevy_color]
path = "../../crates/bevy_color"
version = "0.20.0-dev"
optional = true

[dependencies.bevy_core_pipeline]
path = "../../crates/bevy_core_pipeline"
version = "0.20.0-dev"
optional = true

[dependencies.bevy_derive]
path = "../../crates/bevy_derive"
version = "0.20.0-dev"

[dependencies.bevy_ecs]
path = "../../crates/bevy_ecs"
version = "0.20.0-dev"

[dependencies.bevy_extract]
path = "../../crates/bevy_extract"
version = "0.20.0-dev"
optional = true

[dependencies.bevy_image]
path = "../../crates/bevy_image"
version = "0.20.0-dev"
features = ["zstd_rust"]
optional = true

[dependencies.bevy_input]
path = "../../crates/bevy_input"
version = "0.20.0-dev"

[dependencies.bevy_log]
path = "../../crates/bevy_log"
version = "0.20.0-dev"

[dependencies.bevy_math]
path = "../../crates/bevy_math"
version = "0.20.0-dev"

[dependencies.bevy_mesh]
