[package]
name = "bevy_graphics"
version = "0.20.1"
edition = "2024"
description = "Provides tiered graphics settings for Bevy Engine"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]

[features]
# Makes the ray traced presets available (`RtLite`, `RtFull`). Without it every preset resolves to `Raster`.
solari = ["dep:bevy_solari"]
# Reads DLSS support from `bevy_anti_alias`.
dlss = ["bevy_anti_alias/dlss"]
# Puts NRD on the ray traced rungs' cameras when DLSS Ray Reconstruction cannot run.
nrd = ["bevy_anti_alias/nrd", "solari"]
# `nrd` built without the NRD SDK (`--all-features`): NRD is reported unusable. Not meant for users.
force_disable_nrd = ["bevy_anti_alias/force_disable_nrd"]

[dependencies]
# bevy
bevy_anti_alias = { path = "../bevy_anti_alias", version = "0.20.1" }
bevy_app = { path = "../bevy_app", version = "0.20.1" }
bevy_asset = { path = "../bevy_asset", version = "0.20.1" }
bevy_camera = { path = "../bevy_camera", version = "0.20.1" }
bevy_core_pipeline = { path = "../bevy_core_pipeline", version = "0.20.1" }
bevy_ecs = { path = "../bevy_ecs", version = "0.20.1" }
bevy_light = { path = "../bevy_light", version = "0.20.1" }
bevy_material = { path = "../bevy_material", version = "0.20.1" }
bevy_math = { path = "../bevy_math", version = "0.20.1" }
# Mesh fitting generates missing tangents and skips morphed meshes.
bevy_mesh = { path = "../bevy_mesh", version = "0.20.1", features = [
  "bevy_mikktspace",
  "morph",
] }
bevy_pbr = { path = "../bevy_pbr", version = "0.20.1" }
bevy_platform = { path = "../bevy_platform", version = "0.20.1", default-features = false, features = [
  "std",
] }
bevy_post_process = { path = "../bevy_post_process", version = "0.20.1" }
bevy_reflect = { path = "../bevy_reflect", version = "0.20.1" }
bevy_render = { path = "../bevy_render", version = "0.20.1" }
bevy_solari = { path = "../bevy_solari", version = "0.20.1", optional = true }
bevy_utils = { path = "../bevy_utils", version = "0.20.1" }
bevy_window = { path = "../bevy_window", version = "0.20.1" }

# other
serde = { version = "1", default-features = false, features = ["derive"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
wgpu-types = { version = "30", default-features = false }

# Device-local memory is read from the raw Vulkan adapter: wgpu's `AdapterInfo` has no memory field.
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
ash = { version = "0.38", default-features = false }
wgpu = { version = "30", default-features = false, features = ["vulkan"] }

[dev-dependencies]
bevy_shape = { path = "../bevy_shape", version = "0.20.1" }
ron = "0.12"

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
