[package]
name = "bevy_baked_gi"
version = "0.20.0-dev"
edition = "2024"
description = "Baked irradiance volumes for Bevy Engine: the runtime that loads them, and a baker built on bevy_solari"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]

[features]
# The baker: traces the scene with `bevy_solari` and writes the volumes. Needs a GPU with ray queries; the
# runtime does not.
bake = ["dep:bevy_solari", "dep:bevy_shader"]

[dependencies]
# bevy
bevy_app = { path = "../bevy_app", version = "0.20.0-dev" }
bevy_asset = { path = "../bevy_asset", version = "0.20.0-dev" }
bevy_camera = { path = "../bevy_camera", version = "0.20.0-dev" }
bevy_color = { path = "../bevy_color", version = "0.20.0-dev" }
bevy_ecs = { path = "../bevy_ecs", version = "0.20.0-dev" }
bevy_image = { path = "../bevy_image", version = "0.20.0-dev", features = ["ktx2"] }
bevy_light = { path = "../bevy_light", version = "0.20.0-dev" }
bevy_material = { path = "../bevy_material", version = "0.20.0-dev" }
bevy_math = { path = "../bevy_math", version = "0.20.0-dev" }
bevy_mesh = { path = "../bevy_mesh", version = "0.20.0-dev" }
bevy_pbr = { path = "../bevy_pbr", version = "0.20.0-dev" }
bevy_platform = { path = "../bevy_platform", version = "0.20.0-dev", default-features = false, features = [
  "std",
] }
bevy_reflect = { path = "../bevy_reflect", version = "0.20.0-dev" }
bevy_render = { path = "../bevy_render", version = "0.20.0-dev" }
bevy_transform = { path = "../bevy_transform", version = "0.20.0-dev" }
bevy_solari = { path = "../bevy_solari", version = "0.20.0-dev", optional = true }
bevy_shader = { path = "../bevy_shader", version = "0.20.0-dev", optional = true }

# other
bytemuck = { version = "1" }
half = { version = "2" }
ron = { version = "0.12" }
serde = { version = "1", default-features = false, features = ["derive"] }
thiserror = { version = "2", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }
wgpu-types = { version = "30", default-features = false }

[dev-dependencies]
# zstd_rust: with `bake`, bevy_solari turns on bevy_pbr's LUTs, which need a zstd backend that bevy_internal
# would otherwise choose.
bevy_image = { path = "../bevy_image", version = "0.20.0-dev", features = [
  "ktx2",
  "zstd_rust",
] }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
