[package]
name = "bevy_anti_alias"
version = "0.20.1"
edition = "2024"
description = "Provides various anti-aliasing implementations for Bevy Engine"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
# The TSR shaders ported from SGSR 2 are BSD-3-Clause (their notice is in each file and in THIRD_PARTY_NOTICES.md).
license = "(MIT OR Apache-2.0) AND BSD-3-Clause"
keywords = ["bevy"]

[features]
trace = []
webgl = []
webgpu = []
smaa_luts = ["bevy_image/ktx2", "bevy_image/zstd"]
dlss = ["dep:dlss_wgpu", "dep:uuid", "bevy_render/raw_vulkan_init"]
force_disable_dlss = ["dlss_wgpu?/mock"]
# NVIDIA's NRD (ReBLUR) as the denoiser of ray traced lighting. Needs the NRD SDK at build time: see
# `vendor/nrd_wgpu/README.md` in the repository.
nrd = ["dep:nrd_wgpu"]
# Builds `nrd` without the NRD SDK, so that `--all-features` works without it; NRD then never runs. Not meant for
# users.
force_disable_nrd = ["nrd_wgpu?/mock"]
# AMD FSR 4 / 3.1 through the signed Vulkan DLLs of AMD's FSR SDK, on Radeons under Windows; the DLLs are loaded at
# run time (see `vendor/fsr_wgpu/README.md` in the repository). Elsewhere it does nothing.
fsr = ["dep:fsr_wgpu", "bevy_render/raw_vulkan_init"]
# Builds `fsr` so that FSR never loads, even on Windows. Not meant for users.
force_disable_fsr = ["fsr_wgpu?/mock"]

[dependencies]
# bevy
bevy_asset = { path = "../bevy_asset", version = "0.20.1" }
bevy_reflect = { path = "../bevy_reflect", version = "0.20.1" }
bevy_render = { path = "../bevy_render", version = "0.20.1" }
bevy_camera = { path = "../bevy_camera", version = "0.20.1" }
bevy_math = { path = "../bevy_math", version = "0.20.1" }
bevy_utils = { path = "../bevy_utils", version = "0.20.1" }
bevy_app = { path = "../bevy_app", version = "0.20.1" }
bevy_image = { path = "../bevy_image", version = "0.20.1" }
bevy_derive = { path = "../bevy_derive", version = "0.20.1" }
bevy_shader = { path = "../bevy_shader", version = "0.20.1" }
bevy_ecs = { path = "../bevy_ecs", version = "0.20.1" }
bevy_extract = { path = "../bevy_extract", version = "0.20.1" }
bevy_core_pipeline = { path = "../bevy_core_pipeline", version = "0.20.1" }
bevy_diagnostic = { path = "../bevy_diagnostic", version = "0.20.1" }
bevy_time = { path = "../bevy_time", version = "0.20.1" }

# other
tracing = { version = "0.1", default-features = false, features = ["std"] }
dlss_wgpu = { version = "6.0.0", optional = true }
uuid = { version = "1.21.0", optional = true }
nrd_wgpu = { path = "../../vendor/nrd_wgpu", optional = true }
fsr_wgpu = { path = "../../vendor/fsr_wgpu", optional = true }
# AMD's FSR 3.1 upscaler for TSR (MIT; vendored, see its README).
wgpu_ffx = { path = "../../vendor/wgpu_ffx" }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
features = ["bevy_image/zstd_rust"]

[package.metadata.wgsl-analyzer]
edition = "2026_pre"
root = "src"

[package.metadata.wgsl-analyzer.dependencies]
bevy_core_pipeline = { path = "../bevy_core_pipeline" }
