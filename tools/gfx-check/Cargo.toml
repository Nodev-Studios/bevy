[package]
name = "gfx-check"
edition = "2024"
description = "Runs the graphics testbed over a matrix and gates its images, timings and logs."
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
argh = "0.1"
image = { version = "0.25.2", default-features = false, features = ["png"] }
ron = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
