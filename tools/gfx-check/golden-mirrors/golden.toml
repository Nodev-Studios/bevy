# Written by `gfx-check budget --golden tools/gfx-check/golden --write-golden <results>` from a run of
# tools/gfx-check/golden.ron; do not edit by hand. Each image is the per-pixel mean of one configuration's
# repeats, reduced to `size` with the area filter; `tolerance` is twice the largest difference of one
# repeat from it (at least 0.1 points), and a later run passes when the median of its repeats' differences
# is under it. Only cells on `adapter` at `resolution` are gated; others are recorded.

