[taa]
args = "--mode solari --taa"
warmup = [300, 301, 307]
frames = 300
error = 5.117
error_runs = [5.118, 5.095, 5.138]
error_noise_floor = 0.100
flicker = 0.951
flicker_runs = [0.944, 0.962, 0.947]
flicker_noise_floor = 0.100

[taa-restir]
args = "--mode solari --restir --taa"
warmup = [300, 301, 307]
frames = 300
error = 3.349
error_runs = [3.343, 3.351, 3.353]
error_noise_floor = 0.100
flicker = 0.510
flicker_runs = [0.485, 0.529, 0.516]
flicker_noise_floor = 0.100
